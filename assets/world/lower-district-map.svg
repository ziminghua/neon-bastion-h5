    <g transform="translate(1110 545)"><circle r="31"/><circle r="22" fill="none" opacity="0.45"/></g>
    <g transform="translate(1245 720)"><circle r="31"/><circle r="22" fill="none" opacity="0.45"/></g>
    <g transform="translate(1340 430)"><circle r="31"/><circle r="22" fill="none" opacity="0.45"/></g>
