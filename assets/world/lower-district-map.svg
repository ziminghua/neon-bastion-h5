    <circle r="76" fill="#07101a" stroke="#28556a" stroke-width="3"/>
    <circle r="44" fill="#0d2232" stroke="#54d0e8" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M-164-44h54M110-44h54M-164 44h54M110 44h54M-44-164v54M44-164v54M-44 110v54M44 110v54" stroke="#415a6a" stroke-width="10"/>
    <path d="M-88-130l28 18M88-130l-28 18M-88 130l28-18M88 130l-28-18" stroke="#9b4bd0" stroke-opacity="0.34" stroke-width="6"/>
