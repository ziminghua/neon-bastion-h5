      <path d="M608 675h88v50h-88zm110 0h143v50H718z" fill="#050d16" stroke="#153448"/>
      <path d="M621 708h62M733 708h112" stroke="#27cbe6" stroke-opacity="0.25" stroke-width="4"/>
    </g>

    <g id="core-district">
