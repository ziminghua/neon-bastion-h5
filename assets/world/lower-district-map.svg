      <path d="M1358 174h168v27h-168z" fill="#17122a"/>
      <path d="M1360 238h160" stroke="#ef5c93" stroke-opacity="0.28" stroke-width="4"/>

      <path d="M1182 690h360v70h-360z" fill="#07111b" stroke="#163648" stroke-width="2"/>
      <path d="M1210 714h302" stroke="#2bc4df" stroke-opacity="0.22" stroke-width="5" stroke-dasharray="30 18"/>
    </g>
  </g>

  <!-- environmental connectors -->
  <g fill="none" stroke-linecap="round">
    <path d="M318 270C418 276 464 290 526 332" stroke="#1d5d73" stroke-width="12" opacity="0.22"/>
    <path d="M1045 213C1000 236 970 250 934 282" stroke="#6d388c" stroke-width="10" opacity="0.2"/>
