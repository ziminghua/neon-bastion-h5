<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="0.58" stop-color="#07111d"/>
      <stop offset="1" stop-color="#02060c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182533"/>
      <stop offset="0.5" stop-color="#101923"/>
      <stop offset="1" stop-color="#0a111a"/>
    </linearGradient>
    <linearGradient id="roadEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fd5075"/>
      <stop offset="0.45" stop-color="#8157bd"/>
      <stop offset="1" stop-color="#46cce3"/>
    </linearGradient>
    <radialGradient id="reactorGlow">
      <stop offset="0" stop-color="#7ae8ff" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#436e93" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#02060c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#cc6cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#03070e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="floorGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#244255" stroke-opacity="0.12"/>
      <path d="M14 0V56M28 0V56M42 0V56M0 14H56M0 28H56M0 42H56" fill="none" stroke="#244255" stroke-opacity="0.035"/>
    </pattern>
    <pattern id="roadPlates" width="70" height="38" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="70" height="38" fill="none"/>
      <path d="M0 1H70M0 37H70" stroke="#83a8bd" stroke-opacity="0.1"/>
      <path d="M14 0V38M56 0V38" stroke="#000" stroke-opacity="0.22"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="118" width="1600" height="662" fill="#07101a"/>
  <rect y="118" width="1600" height="662" fill="url(#floorGrid)"/>

  <!-- distant skyline -->
  <g opacity="0.54">
    <path d="M0 118V56h54V92h38V39h70v79h37V67h50v51h61V28h76v90h45V74h48v44h74V48h92v70h58V82h53v36h72V42h88v76h45V64h69v54h64V35h82v83h48V76h58v42h76V52h86v66h54V86h62v32z" fill="#030811"/>
    <g fill="#2bc8ef" opacity="0.22">
      <rect x="112" y="58" width="5" height="5"/><rect x="136" y="78" width="5" height="5"/><rect x="292" y="48" width="6" height="5"/>
      <rect x="520" y="70" width="5" height="5"/><rect x="745" y="52" width="5" height="5"/><rect x="926" y="76" width="6" height="5"/>
      <rect x="1176" y="56" width="5" height="5"/><rect x="1398" y="66" width="5" height="5"/>
    </g>
