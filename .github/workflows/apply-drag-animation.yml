name: Apply tower drag animation

on:
  push:
    branches: [agent/tower-drag-animation]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tower-drag-animation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply drag animation patch
        run: python3 scripts/patch_drag_animation.py
      - name: Check JavaScript
        run: npm run check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch_drag_animation.py .github/workflows/apply-drag-animation.yml
          git add app.js scripts/visual-qa.mjs
          git commit -m 'feat: animate tower dragging and landing'
          git push origin HEAD:agent/tower-drag-animation
