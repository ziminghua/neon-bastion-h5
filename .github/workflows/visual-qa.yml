name: Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize level overhaul
        run: |
          node scripts/apply-level-overhaul.mjs
          node scripts/apply-level-overhaul-adjustments.mjs

      - name: Commit materialized level source
        run: |
          if git diff --quiet -- app.js; then
            echo "app.js already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "feat: materialize tactical level overhaul"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Check active game entry
        run: npm run check

      - name: Install browser driver
        run: |
          which google-chrome
          npm install --no-save playwright-core

      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/neon-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/neon-server.log
          exit 1

      - name: Run visual and full-play QA
        run: node scripts/visual-qa.mjs

      - name: Run random draft QA
        run: node scripts/random-draft-qa.mjs

      - name: Run draft dock layout QA
        run: node scripts/draft-layout-qa.mjs

      - name: Run level design acceptance QA
        run: node scripts/level-design-qa.mjs

      - name: Upload screenshots, reports, and materialized game
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            artifacts/visual-qa
            app.js
          if-no-files-found: error
