name: Visual QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover original upload assets
        run: |
          mkdir -p artifacts/visual-qa/historical
          git show 974896bab112d6626e171fca4098cf34666828ba:'neon-bastion-h5(1).zip' > /tmp/neon-original.zip
          unzip -q /tmp/neon-original.zip -d /tmp/neon-original
          cp -R /tmp/neon-original/neon-bastion-h5/assets artifacts/visual-qa/historical/assets
          cp /tmp/neon-original/neon-bastion-h5/index.html artifacts/visual-qa/historical/index.html
          cp /tmp/neon-original/neon-bastion-h5/app.js artifacts/visual-qa/historical/app.js
          cp /tmp/neon-original/neon-bastion-h5/styles.css artifacts/visual-qa/historical/styles.css
      - name: Install browser driver
        run: |
          which google-chrome
          npm install --no-save playwright-core
      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/neon-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/neon-server.log
          exit 1
      - name: Run visual QA
        run: node scripts/visual-qa.mjs
      - name: Upload screenshots and recovered sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: artifacts/visual-qa
          if-no-files-found: error
