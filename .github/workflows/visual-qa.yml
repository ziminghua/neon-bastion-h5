name: Visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check active game entry
        run: npm run check

      - name: Install browser driver
        run: |
          which google-chrome
          npm install --no-save playwright-core

      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/neon-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/neon-server.log
          exit 1

      - name: Run visual and full-play QA
        run: node scripts/visual-qa.mjs

      - name: Run random draft QA
        run: node scripts/random-draft-qa.mjs

      - name: Run draft dock layout QA
        run: node scripts/draft-layout-qa.mjs

      - name: Run level design acceptance QA
        run: node scripts/level-design-qa.mjs

      - name: Run four-tower VFX acceptance QA
        run: node scripts/vfx-qa.mjs

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: artifacts/visual-qa
          if-no-files-found: error
